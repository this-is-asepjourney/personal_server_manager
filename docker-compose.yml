services:
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: psm-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3005}:3005"
    environment:
      - INTERNAL_API_URL=http://api:8000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - psm-network

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: psm-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Always built from POSTGRES_* so it matches the bundled psm-postgres container.
      # Set PSM_DATABASE_URL in .env only if you want to use an external database.
      - DATABASE_URL=${PSM_DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-psm}:${POSTGRES_PASSWORD:-psm_super_secret_password_change_in_production}@postgres:5432/${POSTGRES_DB:-psm}}
      - STORAGE_BASE_DIR=/opt/psm
      - UPLOAD_DIR=/opt/psm/uploads
      - RELEASE_DIR=/opt/psm/releases
      - SECRET_KEY=${SECRET_KEY:-b8f36a89270df8417727e025170d1fa78f5f4d8520857ef51fa930f785b96a4e}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-dGhpcy1pcy1hLXNhbXBsZS1mZXJuZXQta2V5LTMyeS0=}
      - HOMELAB_AGENT_TOKEN=${HOMELAB_AGENT_TOKEN:-psm_agent_homelab_default_token}
    volumes:
      - psm-storage:/opt/psm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - psm-network

  agent:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.agent
    container_name: psm-agent
    restart: unless-stopped
    environment:
      - SERVER_ID=homelab-primary
      - AGENT_TOKEN=${HOMELAB_AGENT_TOKEN:-psm_agent_homelab_default_token}
      - CONTROL_PLANE_URL=http://api:8000
      - PSM_BASE_DIR=/opt/psm
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - psm-storage:/opt/psm
    depends_on:
      api:
        condition: service_healthy
    networks:
      - psm-network

  postgres:
    image: postgres:17-alpine
    container_name: psm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-psm}
      POSTGRES_USER: ${POSTGRES_USER:-psm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psm_super_secret_password_change_in_production}
    volumes:
      - psm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - psm-network

volumes:
  psm-postgres:
  psm-storage:

networks:
  psm-network:
    driver: bridge
