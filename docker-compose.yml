services:
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: psm-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3005}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    depends_on:
      - api
    networks:
      - psm-network

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: psm-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://psm:psm_super_secret_password_change_in_production@postgres:5432/psm}
      - SECRET_KEY=${SECRET_KEY:-b8f36a89270df8417727e025170d1fa78f5f4d8520857ef51fa930f785b96a4e}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-dGhpcy1pcy1hLXNhbXBsZS1mZXJuZXQta2V5LTMyeS0=}
      - CORS_ORIGINS=http://localhost:3005,http://localhost:3000,http://127.0.0.1:3005
    volumes:
      - psm-storage:/opt/psm
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - psm-network

  postgres:
    image: postgres:17-alpine
    container_name: psm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-psm}
      POSTGRES_USER: ${POSTGRES_USER:-psm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psm_super_secret_password_change_in_production}
    volumes:
      - psm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psm -d psm"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - psm-network

volumes:
  psm-postgres:
  psm-storage:

networks:
  psm-network:
    driver: bridge
